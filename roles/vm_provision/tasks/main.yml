---
- name: Look up the active test VM
  community.general.proxmox_vm_info:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password | default(omit) }}"
    api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ proxmox_vmid }}"
  register: active_vm_state
  failed_when: false
  delegate_to: localhost
  run_once: true

- name: Set fact - active VM exists?
  ansible.builtin.set_fact:
    active_vm_exists: "{{ (active_vm_state.proxmox_vms | default([]) | length) > 0 }}"

- name: Clone template into the active test VM
  community.general.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password | default(omit) }}"
    api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    clone: "{{ template_vm_name }}"
    vmid: "{{ proxmox_template_vmid }}"
    newid: "{{ proxmox_vmid }}"
    name: "{{ vm_name }}"
    full: true
    storage: "{{ proxmox_storage }}"
    timeout: 1800
  delegate_to: localhost
  when: not active_vm_exists

- name: Attach GPU passthrough (PCIe + audio function)
  community.general.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password | default(omit) }}"
    api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ proxmox_vmid }}"
    update: true
    hostpci:
      hostpci0: "host={{ gpu_pci_address }},pcie=1,x-vga=1"
      hostpci1: "host={{ gpu_pci_audio_address }}"
  delegate_to: localhost

- name: Start the active test VM
  community.general.proxmox_kvm:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password | default(omit) }}"
    api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ proxmox_vmid }}"
    state: started
  delegate_to: localhost

- name: Wait for SSH on the test VM
  ansible.builtin.wait_for:
    host: "{{ vm_ip }}"
    port: 22
    delay: "{{ vm_provision_ssh_delay }}"
    timeout: "{{ vm_provision_ssh_timeout }}"
    state: started
  delegate_to: localhost

- name: Take the 'fresh' snapshot
  community.general.proxmox_snap:
    api_host: "{{ proxmox_api_host }}"
    api_user: "{{ proxmox_api_user }}"
    api_password: "{{ proxmox_api_password | default(omit) }}"
    api_token_id: "{{ proxmox_api_token_id | default(omit) }}"
    api_token_secret: "{{ proxmox_api_token_secret | default(omit) }}"
    validate_certs: "{{ proxmox_validate_certs }}"
    node: "{{ proxmox_node }}"
    vmid: "{{ proxmox_vmid }}"
    snapname: "{{ vm_snapshot_name }}"
    description: "{{ vm_snapshot_description }}"
    state: present
  delegate_to: localhost
