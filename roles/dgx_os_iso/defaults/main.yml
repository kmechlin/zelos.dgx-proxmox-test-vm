---
# dgx_os_iso resolves the DGX OS ISO onto the Proxmox node's ISO
# storage. Sources, in priority order:
#   1. already on node at dgx_os_iso
#   2. dgx_os_iso_local_source set (upload from control node)
#   3. dgx_os_iso_url set (fetch directly to node, supports
#      entitlement-auth headers via dgx_os_iso_url_headers)
#   4. fail with an actionable error

# Required: Proxmox volid (<storage>:iso/<filename>).
dgx_os_iso: ""

# Optional sources. At least one of these (or a pre-staged ISO) must
# resolve.
dgx_os_iso_local_source: ""
dgx_os_iso_url: ""
dgx_os_iso_url_headers: {}

# Recommended: sha256 to verify after upload / download.
dgx_os_iso_sha256: ""

# Maps proxmox_iso_storage to a filesystem mountpoint on the node.
proxmox_iso_storage: "local"
proxmox_iso_storage_path: "/var/lib/vz/template/iso"
