---
# Single Proxmox node hosting the test VM. The collection talks to the
# Proxmox API over the same SSH host; community.general.proxmox_kvm
# uses proxmoxer (HTTPS), so this inventory entry also drives where
# template/seed files are written via SSH.

all:
  children:
    proxmox:
      hosts:
        proxmox01:
          ansible_host: 10.0.0.5
          ansible_user: root
          ansible_become: false
          ansible_connection: ssh
