---
# Core tuning knobs for zelos.dgx-proxmox-test-vm.
# Vault secrets live alongside this file in vault.yml (gitignored).

# --- Proxmox connection -----------------------------------------------
proxmox_api_host: "{{ ansible_host }}"
proxmox_api_user: "{{ vault_proxmox_api_user }}"
proxmox_api_password: "{{ vault_proxmox_api_password }}"
proxmox_api_token_id: "{{ vault_proxmox_api_token_id | default('') }}"
proxmox_api_token_secret: "{{ vault_proxmox_api_token_secret | default('') }}"
proxmox_validate_certs: false
proxmox_node: "pve"
proxmox_storage: "local-lvm"
proxmox_iso_storage: "local"
# Filesystem path that proxmox_iso_storage maps to on the node. Default
# matches the stock "local" storage on a typical Proxmox install.
proxmox_iso_storage_path: "/var/lib/vz/template/iso"

# --- VM template ------------------------------------------------------
proxmox_template_vmid: 9000
template_vm_name: "dgx-os-template"
template_disk_size: "100G"
template_memory_mb: 16384
template_cores: 8
template_machine: "q35"
template_bios: "ovmf"
template_efidisk_storage: "{{ proxmox_storage }}"
template_scsihw: "virtio-scsi-pci"
template_net_bridge: "vmbr0"

# --- Active test VM ---------------------------------------------------
proxmox_vmid: 9001
vm_name: "dgx-test"
vm_ip: "10.0.0.10"
vm_mac: ""   # autogenerated if empty
vm_snapshot_name: "fresh"

# --- GPU passthrough --------------------------------------------------
# PCI address of the A6000 on the Proxmox node (lspci -nn | grep -i nvidia).
# Must be bound to vfio-pci (proxmox_host_vfio role handles that).
gpu_pci_address: "0000:01:00.0"
gpu_pci_audio_address: "0000:01:00.1"

# --- DGX OS install ---------------------------------------------------
dgx_os_version: "7"   # "6" or "7"
dgx_os_iso: "{{ vault_dgx_os_iso }}"
dgx_os_iso_local_source: "{{ vault_dgx_os_iso_local_source | default('') }}"
dgx_os_iso_url: "{{ vault_dgx_os_iso_url | default('') }}"
dgx_os_iso_url_headers: "{{ vault_dgx_os_iso_url_headers | default({}) }}"
dgx_os_iso_sha256: "{{ vault_dgx_os_iso_sha256 | default('') }}"

# --- vfio-pci automation on the Proxmox host --------------------------
# CPU family on the Proxmox node. Drives the IOMMU cmdline arg
# (intel_iommu=on or amd_iommu=on). Set explicitly; the role does not
# autodetect.
proxmox_host_cpu_vendor: "intel"   # "intel" or "amd"

# PCI vendor:device IDs (lspci -nn | grep -i nvidia) that should be
# bound to vfio-pci at boot. For an A6000 + its HDMI audio function:
#   - "10de:2230"   # NVIDIA RTX A6000 (GA102GL)
#   - "10de:1aef"   # NVIDIA HDMI audio
proxmox_host_vfio_ids:
  - "10de:2230"
  - "10de:1aef"

# Drivers to blacklist on the Proxmox host so vfio-pci wins the bind.
proxmox_host_vfio_blacklist:
  - nouveau
  - nvidia
  - nvidiafb

# vfio modules loaded at boot. vfio_virqfd is auto-loaded on kernel
# >=6.2 but listed explicitly for older kernels.
proxmox_host_vfio_modules:
  - vfio
  - vfio_iommu_type1
  - vfio_pci
  - vfio_virqfd

# Reboot the Proxmox host automatically when the role changes the
# cmdline / modules / blacklist. Defaults to false so the operator can
# schedule the reboot. The role exits with a warning if a reboot is
# required and this is false.
proxmox_host_vfio_allow_reboot: false

# --- VM admin user (set by autoinstall) -------------------------------
vm_admin_user: "ubuntu"
vm_admin_password_hash: "{{ vault_vm_ubuntu_password_hash }}"
vm_admin_pubkey: "{{ vault_vm_ssh_pubkey }}"
vm_hostname: "dgx-test"
vm_locale: "en_US.UTF-8"
vm_timezone: "Etc/UTC"

# --- Install timeouts -------------------------------------------------
install_ssh_timeout: 3600   # seconds; DGX OS autoinstall is ~30-60 min
install_ssh_delay: 30
