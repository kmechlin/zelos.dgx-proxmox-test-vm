[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zptv"
version = "0.1.0"
description = "Operator CLI for the zelos.dgx-proxmox-test-vm collection"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "kmechlin" }]
dependencies = ["typer>=0.12", "proxmoxer>=2.0", "requests>=2.32"]

[project.scripts]
zptv = "zptv.app:app"

[tool.setuptools.packages.find]
where = ["cli"]
